name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }} ${{ matrix.configuration }}
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, macOS, watchOS]
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show existing Xcode and SDKs
        run: |
          xcodebuild -version
          xcodebuild -showsdks
      - name: Build app, widgets and local packages without signing
        env:
          PLATFORM: ${{ matrix.platform }}
          CONFIGURATION: ${{ matrix.configuration }}
        run: |
          set -euo pipefail
          scheme='Backyard Birds'
          case "$PLATFORM" in
            iOS) destination='generic/platform=iOS Simulator' ;;
            macOS) destination='platform=macOS' ;;
            watchOS) destination='generic/platform=watchOS Simulator'; scheme='Widgets (Watch)' ;;
            *) exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/build-logs"
          xcodebuild -project 'Backyard Birds.xcodeproj' -scheme "$scheme" \
            -configuration "$CONFIGURATION" \
            -destination "$destination" -jobs 2 \
            -derivedDataPath "$RUNNER_TEMP/backyard-build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            build 2>&1 | tee "$RUNNER_TEMP/build-logs/build.log"
          echo "Unsigned $PLATFORM $CONFIGURATION build passed. Build coverage only; no implemented test targets, app launch, StoreKit purchase or cloud operation is exercised." >> "$GITHUB_STEP_SUMMARY"
      - name: Verify tracked source was preserved
        run: git diff --exit-code
      - name: Retain failure logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: build-failure-${{ matrix.platform }}-${{ matrix.configuration }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/build-logs/
          retention-days: 3
